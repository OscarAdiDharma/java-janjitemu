server.port=${PORT:5000}
spring.application.name=janjitemu-backend

# MongoDB Connection (Lokal localhost:27017 atau override via env MONGO_URI)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/janjitemu}

# JWT Security Settings
app.jwt.secret=${JWT_SECRET:kunci_rahasia_janjitemu_2026_!@#kunci_rahasia_janjitemu_2026_!@#}
app.jwt.expiration-ms=86400000

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC
